name: Security Check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/security.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: 'Image Scan (PHP: ${{ matrix.php-version }}, Variant: ${{ matrix.variant }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        variant:
          - fpm
          - fpm-otel
          - caddy
          - caddy-otel
          - nginx
          - nginx-otel
          - frankenphp
          - frankenphp-otel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for vulnerabilities
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://shopware/docker-base:${{ matrix.php-version }}-${{ matrix.variant }}
          dockerhub-user: ${{ secrets.DOCKER_HUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          sarif-file: scout.sarif.json
          write-comment: false

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: scout.sarif.json
          category: ${{ matrix.php-version }}-${{ matrix.variant }}

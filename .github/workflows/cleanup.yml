name: Cleanup GHCR
on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  packages: write

jobs:
  cleanup:
    name: Cleanup GHCR
    runs-on: ubuntu-26.04
    steps:
      - name: Cleanup GHCR
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          packages: docker-base-ci-test,docker-dev-ci-test,demo-ci-test
          older-than: 1 day

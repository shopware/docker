name: Build FPM PHP minor

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP minor version to build
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  prepare-dev:
    name: Dev targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.dev-targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read dev targets from Bake
        id: dev-targets
        env:
          phpMinor: ${{ inputs.php-version }}
        run: |
          targets=$(docker buildx bake -f docker-bake.hcl -f docker-bake.fpm.hcl --print caddy-dev nginx-dev | jq -c '[.group["caddy-dev"].targets[], .group["nginx-dev"].targets[]]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fpm:
    name: FPM
    uses: ./.github/workflows/build-image.yml
    with:
      family: fpm
      php-version: ${{ inputs.php-version }}
      target: fpm
    secrets: inherit

  fpm-otel:
    name: FPM with OpenTelemetry
    needs: [fpm]
    uses: ./.github/workflows/build-image.yml
    with:
      family: fpm
      php-version: ${{ inputs.php-version }}
      target: fpm-otel
    secrets: inherit

  webserver:
    name: ${{ matrix.webserver }}
    needs: [fpm]
    strategy:
      fail-fast: false
      matrix:
        webserver: [ caddy, nginx ]
    uses: ./.github/workflows/build-image.yml
    with:
      family: fpm
      php-version: ${{ inputs.php-version }}
      target: ${{ matrix.webserver }}
    secrets: inherit

  webserver-otel:
    name: ${{ matrix.webserver }} with OpenTelemetry
    needs: [fpm-otel]
    strategy:
      fail-fast: false
      matrix:
        webserver: [ caddy, nginx ]
    uses: ./.github/workflows/build-image.yml
    with:
      family: fpm
      php-version: ${{ inputs.php-version }}
      target: ${{ matrix.webserver }}-otel
    secrets: inherit

  dev:
    name: ${{ matrix.target }}
    needs: [webserver-otel, prepare-dev]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-dev.outputs.targets) }}
    uses: ./.github/workflows/build-image.yml
    with:
      family: fpm
      php-version: ${{ inputs.php-version }}
      target: ${{ matrix.target }}
    secrets: inherit

  dev-check:
    if: inputs.php-version == '8.4'
    name: Check Dev Image
    runs-on: ubuntu-latest
    needs: [dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install a binary from GitHub releases
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: GoogleContainerTools/container-structure-test
          extension-matching: disable
          rename-to: container-structure-test
          chmod: 0755

      - name: Determine image tag
        id: image-tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "IMAGE_TAG=ghcr.io/shopware/docker-dev-ci-test:${{ github.event.number }}-php8.4-node24-caddy" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=ghcr.io/shopware/docker-dev:php8.4-node24-caddy" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull image
        run: docker pull ${{ steps.image-tag.outputs.IMAGE_TAG }}

      - name: Test Dev Image
        run: container-structure-test test --config dev/config.yaml --image ${{ steps.image-tag.outputs.IMAGE_TAG }}

  check:
    if: inputs.php-version == '8.3'
    name: Test Image with Webserver ${{ matrix.webserver }}
    runs-on: ubuntu-latest
    needs: [webserver]
    strategy:
      matrix:
        webserver:
          - caddy
          - nginx
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout example repo
        uses: actions/checkout@v7
        with:
          repository: shopwareLabs/example-docker-repository

      - name: Build main branch
        if: github.event_name != 'pull_request'
        run: docker compose build --build-arg BASE_IMAGE=ghcr.io/shopware/docker-base:8.3-${{ matrix.webserver }}

      - name: Build PR
        if: github.event_name == 'pull_request'
        run: docker compose build --build-arg BASE_IMAGE=ghcr.io/shopware/docker-base-ci-test:${{ github.event.number }}-8.3-${{ matrix.webserver}}

      - name: Run image
        run: docker compose up -d --wait

      - name: Wait for Webserver reachable
        run: |
          attempt_counter=0
          max_attempts=5

          until curl --output /dev/null --silent --head --fail localhost:8000/admin; do
              if [ ${attempt_counter} -eq ${max_attempts} ];then
                echo "Max attempts reached"
                exit 1
              fi

              printf '.'
              attempt_counter=$((attempt_counter+1))
              sleep 5
          done

      - name: Check if shopware admin is running
        run: curl --fail localhost:8000/admin

      - name: Check if shopware is running
        run: curl --fail localhost:8000

      # output logs if failed
      - name: Output logs
        if: always()
        run: docker compose logs

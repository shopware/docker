name: Build FPM Images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docker-bake.hcl'
      - 'docker-bake.fpm.hcl'
      - '.github/workflows/build-fpm.yml'
      - '.github/action/build-bake-publish/**'
      - 'fpm/**'
      - 'fpm-otel/**'
      - 'caddy/**'
      - 'nginx/**'
      - 'dev/**'
  pull_request:
    paths:
      - 'docker-bake.hcl'
      - 'docker-bake.fpm.hcl'
      - '.github/workflows/build-fpm.yml'
      - '.github/action/build-bake-publish/**'
      - 'fpm/**'
      - 'fpm-otel/**'
      - 'caddy/**'
      - 'nginx/**'
      - 'dev/**'
  schedule:
    - cron: '10 4 * * *'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  COSIGN_EXPERIMENTAL: 1

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  fpm:
    name: FPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/action/build-bake-publish
        with:
          files: |
            docker-bake.hcl
            docker-bake.fpm.hcl
          targets: fpm
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  fpm-otel:
    name: FPM with OpenTelemetry
    runs-on: ubuntu-latest
    needs: [fpm]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/action/build-bake-publish
        with:
          files: |
            docker-bake.hcl
            docker-bake.fpm.hcl
          targets: fpm-otel
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  webserver:
    name: ${{ matrix.webserver }}
    runs-on: ubuntu-latest
    needs: [fpm]
    strategy:
      fail-fast: false
      matrix:
        webserver: [ caddy, nginx ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/action/build-bake-publish
        with:
          files: |
            docker-bake.hcl
            docker-bake.fpm.hcl
          targets: ${{ matrix.webserver}}
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  webserver-otel:
    name: ${{ matrix.webserver }} with OpenTelemetry
    runs-on: ubuntu-latest
    needs: [fpm-otel]
    strategy:
      fail-fast: false
      matrix:
        webserver: [ caddy, nginx ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/action/build-bake-publish
        with:
          files: |
            docker-bake.hcl
            docker-bake.fpm.hcl
          targets: ${{ matrix.webserver}}-otel
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  dev:
    name: Dev ${{ matrix.webserver }}
    runs-on: ubuntu-latest
    needs: [webserver-otel]
    strategy:
      fail-fast: false
      matrix:
        webserver: [ caddy, nginx ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/action/build-bake-publish
        with:
          files: |
            docker-bake.hcl
            docker-bake.fpm.hcl
          targets: ${{ matrix.webserver }}-dev
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  dev-check:
    name: Check Dev Image
    runs-on: ubuntu-latest
    needs: [dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install a binary from GitHub releases
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: GoogleContainerTools/container-structure-test
          extension-matching: disable
          rename-to: container-structure-test
          chmod: 0755

      - name: Determine image tag
        id: image-tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "IMAGE_TAG=ghcr.io/shopware/docker-dev-ci-test:${{ github.event.number }}-php8.4-node24-caddy" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=ghcr.io/shopware/docker-dev:php8.4-node24-caddy" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull image
        run: docker pull ${{ steps.image-tag.outputs.IMAGE_TAG }}

      - name: Test Dev Image
        run: container-structure-test test --config dev/config.yaml --image ${{ steps.image-tag.outputs.IMAGE_TAG }}

  check:
    name: Test Image with Webserver ${{ matrix.webserver }}
    runs-on: ubuntu-latest
    needs: [webserver]
    strategy:
      matrix:
        webserver:
          - caddy
          - nginx
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout example repo
        uses: actions/checkout@v7
        with:
          repository: shopwareLabs/example-docker-repository

      - name: Build main branch
        if: github.event_name != 'pull_request'
        run: docker compose build --build-arg BASE_IMAGE=ghcr.io/shopware/docker-base:8.3-${{ matrix.webserver }}

      - name: Build PR
        if: github.event_name == 'pull_request'
        run: docker compose build --build-arg BASE_IMAGE=ghcr.io/shopware/docker-base-ci-test:${{ github.event.number }}-8.3-${{ matrix.webserver}}

      - name: Run image
        run: docker compose up -d --wait

      - name: Wait for Webserver reachable
        run: |
          attempt_counter=0
          max_attempts=5

          until curl --output /dev/null --silent --head --fail localhost:8000/admin; do
              if [ ${attempt_counter} -eq ${max_attempts} ];then
                echo "Max attempts reached"
                exit 1
              fi

              printf '.'
              attempt_counter=$((attempt_counter+1))
              sleep 5
          done

      - name: Check if shopware admin is running
        run: curl --fail localhost:8000/admin

      - name: Check if shopware is running
        run: curl --fail localhost:8000

      # output logs if failed
      - name: Output logs
        if: always()
        run: docker compose logs

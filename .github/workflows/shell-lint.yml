name: Shellcheck
on:
  pull_request:
    paths:
      - "rootfs/setup*"

permissions:
  contents: read

jobs:
  lint:
    name: Shell Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0

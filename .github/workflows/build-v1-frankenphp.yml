name: Build v1 FrankenPHP Images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'v1/docker-bake.hcl'
      - '.github/workflows/build-v1-frankenphp.yml'
      - '.github/workflows/build-bake-publish.yml'
      - 'scripts/bake-matrix*.mjs'
      - 'v1/frankenphp/**'
  pull_request:
    paths:
      - 'v1/docker-bake.hcl'
      - '.github/workflows/build-v1-frankenphp.yml'
      - '.github/workflows/build-bake-publish.yml'
      - 'scripts/bake-matrix*.mjs'
      - 'v1/frankenphp/**'
  schedule:
    - cron: '10 4 * * *'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  matrix:
    name: Determine Bake targets and tags
    runs-on: ubuntu-latest
    outputs:
      frankenphp: ${{ steps.matrix.outputs.frankenphp }}
      frankenphp-otel: ${{ steps.matrix.outputs.frankenphp-otel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Bake matrices
        run: node --test scripts/bake-matrix.test.mjs

      - name: Read build matrices from Bake
        id: matrix
        env:
          imageSuffix: ${{ github.event_name == 'pull_request' && '-ci-test' || '' }}
          tagPrefix: ${{ github.event_name == 'pull_request' && format('{0}-', github.event.number) || '' }}
        run: |
          matrix=$(node scripts/bake-matrix.mjs frankenphp frankenphp)
          echo "frankenphp=$matrix" >> "$GITHUB_OUTPUT"
          matrix=$(node scripts/bake-matrix.mjs frankenphp frankenphp-otel)
          echo "frankenphp-otel=$matrix" >> "$GITHUB_OUTPUT"

  frankenphp:
    name: ${{ matrix.target }}
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.frankenphp) }}
    uses: ./.github/workflows/build-bake-publish.yml
    with:
      family: frankenphp
      target: ${{ matrix.target }}
      meta-images: ${{ matrix.images }}
      meta-tags: ${{ matrix.tags }}
    secrets:
      docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
      docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  frankenphp-otel:
    name: ${{ matrix.target }}
    needs: [matrix, frankenphp]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.frankenphp-otel) }}
    uses: ./.github/workflows/build-bake-publish.yml
    with:
      family: frankenphp
      target: ${{ matrix.target }}
      meta-images: ${{ matrix.images }}
      meta-tags: ${{ matrix.tags }}
    secrets:
      docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
      docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}

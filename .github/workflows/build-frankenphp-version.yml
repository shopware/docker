name: Build FrankenPHP PHP minor

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP minor version to build
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  frankenphp:
    name: FrankenPHP
    uses: ./.github/workflows/build-image.yml
    with:
      family: frankenphp
      php-version: ${{ inputs.php-version }}
      target: frankenphp
    secrets: inherit

  frankenphp-otel:
    name: FrankenPHP with OpenTelemetry
    needs: [frankenphp]
    uses: ./.github/workflows/build-image.yml
    with:
      family: frankenphp
      php-version: ${{ inputs.php-version }}
      target: frankenphp-otel
    secrets: inherit

name: Build FrankenPHP PHP minor

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP minor version to build
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  frankenphp:
    name: FrankenPHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/action/build-bake-publish
        with:
          php-version: ${{ inputs.php-version }}
          files: |
            docker-bake.hcl
            docker-bake.frankenphp.hcl
          targets: frankenphp
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  frankenphp-otel:
    name: FrankenPHP with OpenTelemetry
    runs-on: namespace-profile-default
    needs: [frankenphp]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/action/build-bake-publish
        with:
          php-version: ${{ inputs.php-version }}
          files: |
            docker-bake.hcl
            docker-bake.frankenphp.hcl
          targets: frankenphp-otel
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

name: Build and publish image

on:
  workflow_call:
    inputs:
      family:
        description: Bake family (fpm or frankenphp)
        required: true
        type: string
      php-version:
        description: PHP minor version to build
        required: true
        type: string
      target:
        description: Concrete Bake target or group resolving to one target
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  metadata:
    name: Resolve image metadata
    runs-on: ubuntu-latest
    outputs:
      target: ${{ fromJSON(steps.metadata.outputs.metadata).target }}
      images: ${{ fromJSON(steps.metadata.outputs.metadata).images }}
      tags: ${{ fromJSON(steps.metadata.outputs.metadata).tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read image metadata from Bake
        id: metadata
        env:
          BAKE_FAMILY: ${{ inputs.family }}
          BAKE_TARGET: ${{ inputs.target }}
          phpMinor: ${{ inputs.php-version }}
          imageSuffix: ${{ github.event_name == 'pull_request' && '-ci-test' || '' }}
          tagPrefix: ${{ github.event_name == 'pull_request' && format('{0}-', github.event.number) || '' }}
        run: |
          docker buildx bake -f docker-bake.hcl -f "docker-bake.${BAKE_FAMILY}.hcl" --print "$BAKE_TARGET" |
            node .github/scripts/bake-metadata.mjs "$BAKE_TARGET" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [metadata]
    uses: docker/github-builder/.github/workflows/bake.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1
    with:
      files: |
        docker-bake.hcl
        docker-bake.${{ inputs.family }}.hcl
      target: ${{ needs.metadata.outputs.target }}
      vars: |
        phpMinor=${{ inputs.php-version }}
        imageSuffix=${{ github.event_name == 'pull_request' && '-ci-test' || '' }}
        tagPrefix=${{ github.event_name == 'pull_request' && format('{0}-', github.event.number) || '' }}
      output: image
      push: true
      distribute: true
      cache: true
      cache-mode: max
      cache-scope: ${{ needs.metadata.outputs.target }}
      sbom: true
      sign: 'true'
      meta-images: ${{ needs.metadata.outputs.images }}
      meta-tags: ${{ needs.metadata.outputs.tags }}
      meta-flavor: latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ toJSON(secrets.DOCKER_HUB_USERNAME) }}
          password: ${{ toJSON(secrets.DOCKER_HUB_PASSWORD) }}
        - registry: ghcr.io
          username: ${{ toJSON(github.actor) }}
          password: ${{ toJSON(secrets.GITHUB_TOKEN) }}

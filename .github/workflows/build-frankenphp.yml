name: Build FrankenPHP Images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docker-bake.hcl'
      - 'docker-bake.frankenphp.hcl'
      - '.github/workflows/build-frankenphp.yml'
      - '.github/workflows/build-frankenphp-version.yml'
      - '.github/workflows/build-image.yml'
      - '.github/scripts/bake-metadata*.mjs'
      - 'frankenphp/**'
      - 'frankenphp-otel/**'
  pull_request:
    paths:
      - 'docker-bake.hcl'
      - 'docker-bake.frankenphp.hcl'
      - '.github/workflows/build-frankenphp.yml'
      - '.github/workflows/build-frankenphp-version.yml'
      - '.github/workflows/build-image.yml'
      - '.github/scripts/bake-metadata*.mjs'
      - 'frankenphp/**'
      - 'frankenphp-otel/**'
  schedule:
    - cron: '10 4 * * *'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  prepare:
    name: PHP versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.php-versions.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Bake metadata conversion
        run: node --test .github/scripts/bake-metadata.test.mjs

      - name: Read PHP versions from Bake
        id: php-versions
        run: |
          versions=$(docker buildx bake -f docker-bake.hcl -f docker-bake.frankenphp.hcl --print frankenphp | jq -c '.group["frankenphp"].targets | map(ltrimstr("frankenphp-") | gsub("-"; "."))')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.php-version }}
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    uses: ./.github/workflows/build-frankenphp-version.yml
    with:
      php-version: ${{ matrix.php-version }}
    secrets: inherit

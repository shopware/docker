name: Build FrankenPHP Images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docker-bake.hcl'
      - 'docker-bake.frankenphp.hcl'
      - '.github/workflows/build-frankenphp.yml'
      - '.github/action/build-bake-publish/**'
      - '.github/action/setup-builder/**'
      - 'frankenphp/**'
      - 'frankenphp-otel/**'
  pull_request:
    paths:
      - 'docker-bake.hcl'
      - 'docker-bake.frankenphp.hcl'
      - '.github/workflows/build-frankenphp.yml'
      - '.github/action/build-bake-publish/**'
      - '.github/action/setup-builder/**'
      - 'frankenphp/**'
      - 'frankenphp-otel/**'
  schedule:
    - cron: '10 4 * * *'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  COSIGN_EXPERIMENTAL: 1

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  matrix:
    name: Determine PHP versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read PHP versions from Bake
        id: matrix
        run: |
          matrix=$(docker buildx bake -f docker-bake.hcl -f docker-bake.frankenphp.hcl --print frankenphp | jq -c '{include: [.group.frankenphp.targets[] | ltrimstr("frankenphp-") | {php: gsub("-"; "."), suffix: .}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  frankenphp:
    name: FrankenPHP PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up builder
        uses: ./.github/action/setup-builder
        with:
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build FrankenPHP
        uses: ./.github/action/build-bake-publish
        with:
          files: |
            docker-bake.hcl
            docker-bake.frankenphp.hcl
          targets: frankenphp-${{ matrix.suffix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build FrankenPHP with OpenTelemetry
        uses: ./.github/action/build-bake-publish
        with:
          files: |
            docker-bake.hcl
            docker-bake.frankenphp.hcl
          targets: frankenphp-otel-${{ matrix.suffix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

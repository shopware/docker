name: Build FrankenPHP Images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docker-bake.hcl'
      - 'docker-bake.frankenphp.hcl'
      - '.github/workflows/build-frankenphp.yml'
      - '.github/action/build-bake-publish/**'
      - 'frankenphp/**'
      - 'frankenphp-otel/**'
  pull_request:
    paths:
      - 'docker-bake.hcl'
      - 'docker-bake.frankenphp.hcl'
      - '.github/workflows/build-frankenphp.yml'
      - '.github/action/build-bake-publish/**'
      - 'frankenphp/**'
      - 'frankenphp-otel/**'
  schedule:
    - cron: '10 4 * * *'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  prepare:
    name: PHP versions
    runs-on: ubuntu-26.04
    outputs:
      versions: ${{ steps.php-versions.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Read PHP versions from Bake
        id: php-versions
        run: |
          versions=$(docker buildx bake -f docker-bake.hcl -f docker-bake.frankenphp.hcl --print frankenphp | jq -c '.group["frankenphp"].targets | map(ltrimstr("frankenphp-") | gsub("-"; "."))')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.php-version }}
    needs: [prepare]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build and publish FrankenPHP images
        uses: $/.github/action/build-bake-publish
        with:
          php-version: ${{ matrix.php-version }}
          family: frankenphp
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

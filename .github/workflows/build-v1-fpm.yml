name: Build v1 FPM Images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'v1/docker-bake.hcl'
      - '.github/workflows/build-v1-fpm.yml'
      - '.github/workflows/build-bake-publish.yml'
      - 'scripts/bake-matrix*.mjs'
      - 'v1/fpm/**'
  pull_request:
    paths:
      - 'v1/docker-bake.hcl'
      - '.github/workflows/build-v1-fpm.yml'
      - '.github/workflows/build-bake-publish.yml'
      - 'scripts/bake-matrix*.mjs'
      - 'v1/fpm/**'
  schedule:
    - cron: '10 4 * * *'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  matrix:
    name: Determine Bake targets and tags
    runs-on: ubuntu-26.04
    outputs:
      fpm: ${{ steps.matrix.outputs.fpm }}
      fpm-otel: ${{ steps.matrix.outputs.fpm-otel }}
      webserver: ${{ steps.matrix.outputs.webserver }}
      dev: ${{ steps.matrix.outputs.dev }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Bake matrices
        run: node --test scripts/bake-matrix.test.mjs

      - name: Read build matrices from Bake
        id: matrix
        env:
          imageSuffix: ${{ github.event_name == 'pull_request' && '-ci-test' || '' }}
          tagPrefix: ${{ github.event_name == 'pull_request' && format('{0}-', github.event.number) || '' }}
        run: |
          matrix=$(node scripts/bake-matrix.mjs fpm fpm)
          echo "fpm=$matrix" >> "$GITHUB_OUTPUT"
          matrix=$(node scripts/bake-matrix.mjs fpm fpm-otel)
          echo "fpm-otel=$matrix" >> "$GITHUB_OUTPUT"
          matrix=$(node scripts/bake-matrix.mjs fpm caddy nginx caddy-otel nginx-otel)
          echo "webserver=$matrix" >> "$GITHUB_OUTPUT"
          matrix=$(node scripts/bake-matrix.mjs fpm caddy-dev nginx-dev)
          echo "dev=$matrix" >> "$GITHUB_OUTPUT"

  fpm:
    name: ${{ matrix.target }}
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.fpm) }}
    uses: ./.github/workflows/build-bake-publish.yml
    with:
      family: fpm
      target: ${{ matrix.target }}
      meta-images: ${{ matrix.images }}
      meta-tags: ${{ matrix.tags }}
    secrets:
      docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
      docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  fpm-otel:
    name: ${{ matrix.target }}
    needs: [matrix, fpm]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.fpm-otel) }}
    uses: ./.github/workflows/build-bake-publish.yml
    with:
      family: fpm
      target: ${{ matrix.target }}
      meta-images: ${{ matrix.images }}
      meta-tags: ${{ matrix.tags }}
    secrets:
      docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
      docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  webserver:
    name: ${{ matrix.target }}
    needs: [matrix, fpm-otel]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.webserver) }}
    uses: ./.github/workflows/build-bake-publish.yml
    with:
      family: fpm
      target: ${{ matrix.target }}
      meta-images: ${{ matrix.images }}
      meta-tags: ${{ matrix.tags }}
    secrets:
      docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
      docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  dev:
    name: ${{ matrix.target }}
    needs: [matrix, webserver]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.dev) }}
    uses: ./.github/workflows/build-bake-publish.yml
    with:
      family: fpm
      target: ${{ matrix.target }}
      meta-images: ${{ matrix.images }}
      meta-tags: ${{ matrix.tags }}
    secrets:
      docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
      docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  dev-check:
    name: Check Dev Image
    runs-on: ubuntu-26.04
    needs: [dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install a binary from GitHub releases
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: GoogleContainerTools/container-structure-test
          extension-matching: disable
          rename-to: container-structure-test
          chmod: 0755

      - name: Determine image tag
        id: image-tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "IMAGE_TAG=ghcr.io/shopware/docker-dev-ci-test:${{ github.event.number }}-php8.4-node24-caddy" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=ghcr.io/shopware/docker-dev:php8.4-node24-caddy" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull image
        run: docker pull ${{ steps.image-tag.outputs.IMAGE_TAG }}

      - name: Test Dev Image
        run: container-structure-test test --config v1/fpm/dev/config.yaml --image ${{ steps.image-tag.outputs.IMAGE_TAG }}

  check:
    name: Test Image with Webserver ${{ matrix.webserver }}
    runs-on: ubuntu-26.04
    needs: [webserver]
    strategy:
      matrix:
        webserver:
          - caddy
          - nginx
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout example repo
        uses: actions/checkout@v7
        with:
          repository: shopwareLabs/example-docker-repository

      - name: Build main branch
        if: github.event_name != 'pull_request'
        run: docker compose build --build-arg BASE_IMAGE=ghcr.io/shopware/docker-base:8.3-${{ matrix.webserver }}

      - name: Build PR
        if: github.event_name == 'pull_request'
        run: docker compose build --build-arg BASE_IMAGE=ghcr.io/shopware/docker-base-ci-test:${{ github.event.number }}-8.3-${{ matrix.webserver}}

      - name: Run image
        run: docker compose up -d --wait

      - name: Wait for Webserver reachable
        run: |
          attempt_counter=0
          max_attempts=5

          until curl --output /dev/null --silent --head --fail localhost:8000/admin; do
              if [ ${attempt_counter} -eq ${max_attempts} ];then
                echo "Max attempts reached"
                exit 1
              fi

              printf '.'
              attempt_counter=$((attempt_counter+1))
              sleep 5
          done

      - name: Check if shopware admin is running
        run: curl --fail localhost:8000/admin

      - name: Check if shopware is running
        run: curl --fail localhost:8000

      # output logs if failed
      - name: Output logs
        if: always()
        run: docker compose logs

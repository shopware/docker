name: Build standalone PHP FPM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['php-fpm/**']
  pull_request:
    paths: ['php-fpm/**']

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: matrix
        run: |
          matrix=$(docker buildx bake -f php-fpm/docker-bake.hcl --print fpm | jq -c '{include: [.group.fpm.targets[] | ltrimstr("fpm-") | {php: gsub("-"; "."), suffix: .}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  fpm:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/action/setup-builder
        with:
          docker_hub_username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker_hub_password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish PHP FPM
        uses: ./.github/action/build-bake-publish
        with:
          files: php-fpm/docker-bake.hcl
          targets: fpm-${{ matrix.suffix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

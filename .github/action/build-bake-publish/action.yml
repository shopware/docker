name: 'Build and Publish'
description: 'Builds and pushes images using the builder configured by setup-builder'
inputs:
  files:
    description: 'Bake files to load'
    required: true
  targets:
    description: 'Targets'
    required: true
    default: ''
  github_token:
    description: 'GitHub token'
    required: true
runs:
  using: "composite"
  steps:
    - name: Build and push
      uses: docker/bake-action@v6
      with:
        push: true
        files: ${{ inputs.files }}
        targets: ${{ inputs.targets }}
        set: |
          *.secrets=id=composer_auth,env=COMPOSER_AUTH
        no-cache: true
      env:
        COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ inputs.github_token }}"}}'
        DOCKER_BUILD_RECORD_UPLOAD: false
        DOCKER_BUILD_SUMMARY: false
        imageSuffix: ${{ github.event_name == 'pull_request' && '-ci-test' || '' }}
        tagPrefix: ${{ github.event_name == 'pull_request' && format('{0}-', github.event.number) || '' }}
